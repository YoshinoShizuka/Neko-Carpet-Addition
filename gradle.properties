org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ===== 目标平台 =====
# 注意：从 26.x 开始 Minecraft 本体不再混淆，Loom 走「不 remap」的插件，
# 因此 build.gradle 里既不需要 mappings，也不需要 modImplementation。
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# ===== Carpet 依赖 =====
# Carpet 26.3 正式版（26.3+v260915）目前只发布在 Modrinth，
# masa 的 maven 上最新只到 26.3-beta-3+v260820。
# 这里用 Modrinth 的「版本 id」引用，避免和游戏版本号混淆。
carpet_modrinth_version=yt9oDFOj
# 若 masa maven 补齐了正式版，可改成用下面这行（同时把 repositories 里的 masa maven 打开）：
# carpet_masa_version=26.3+v260915

# ===== Mod 元信息 =====
mod_version=1.0.0
maven_group=neko
archives_base_name=carpet-Neko-Addition
