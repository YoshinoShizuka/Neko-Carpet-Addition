org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=false

# ===== 目标平台 =====
# 26.x 起 Minecraft 本体不再混淆，Loom 走「不 remap」的插件。
minecraft_version=26.2
loader_version=0.19.5
loom_version=1.18.2

# ===== Carpet 依赖 =====
# Carpet 26.2 在 Modrinth 上的版本 id（bGrLxJ8v）。
carpet_modrinth_version=bGrLxJ8v

# ===== Mod 元信息
# Fabric API：打印机联动的 C2S/S2C 数据包要用它的 networking 抽象。
# 版本号从 Fabric maven-metadata 里挑「for Minecraft <本版本>」的最新一个。
# 这只是普通依赖，运行时需要玩家另行安装 Fabric API，所以在 fabric.mod.json
# 里还写了一条 depends，服务端缺桩时会在加载阶段给出明确提示。
fabric_version=0.161.0+26.2
 =====
mod_version=1.0.11
maven_group=neko
archives_base_name=carpet-Neko-Addition
