# ===== Minecraft 1.21.11 版本层参数 =====
# 落地时按 Fabric 官网核对最新值；以下为已核实的版本（2026-09-28）。

minecraft_version=1.21.11
loader_version=0.19.5
# 与 modern/26.x 保持同一个 Loom 版本：本仓库用的是 Gradle 9.7，
# 只有 1.18.x 的 Loom 能在这上面跑（骨架里原先写的 1.9.2 对应 Gradle 8.x）。
loom_version=1.18.2

# Carpet for 1.21.11（masa maven 坐标）
# 1.21.11 线上只有两个版本：1.4.193+v251211 与 1.4.194+v260107，取较新的那个。
# （骨架原先写的 v251223 在 masa 上并不存在，解析必然失败）
carpet_version=1.21.11-1.4.194+v260107

# Fabric API：打印机联动的 C2S/S2C 数据包要用它的 networking 抽象。
# 版本号从 Fabric maven-metadata 里挑「for Minecraft 1.21.11」的最新一个。
# 运行时需要玩家另行安装 Fabric API，所以 fabric.mod.json 里还写了一条 depends。
fabric_version=0.141.6+1.21.11

# Mod 元信息
mod_version=1.0.6
maven_group=neko
archives_base_name=carpet-Neko-Addition
